name: CI

on:
  push:
    branches: [main, develop]
    paths:
      - 'src/**'
      - 'tests/**'
      - '.github/workflows/**'
      - 'pyproject.toml'
      - 'Makefile'
      - '*.md'
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - '.github/workflows/**'
      - 'pyproject.toml'
      - 'Makefile'
      - '*.md'

env:
  # Worker image matrix - must be kept in sync with scan job
  WORKER_IMAGES: >
    ["scheduler","executor","sidecar-executor","sidecar-scheduler","sidecar-api"]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11"]

    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install uv
        uses: astral-sh/setup-uv@v3
      - name: Install dependencies
        run: uv sync
      - name: Run tests
        run: uv run pytest --cov=src tests/
      - name: Lint
        run: uv run flake8 src/ tests/

  # Build worker images based on matrix
  build-worker-images:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        worker: ["scheduler", "executor", "sidecar-executor", "sidecar-scheduler", "sidecar-api"]
    outputs:
      image-digests: ${{ steps.build.outputs.digests }}
    steps:
      - uses: actions/checkout@v4
      - name: Build worker image ${{ matrix.worker }}
        id: build
        run: |
          IMAGE_TAG="ghcr.io/orchestration-agent/worker-${{ matrix.worker }}:$(git rev-parse --short HEAD)"
          echo "Building $IMAGE_TAG"
          # Simulate build and digest extraction (replace with actual docker buildx)
          DIGEST="sha256:$(echo $IMAGE_TAG-${{ github.sha }} | sha256sum | cut -d' ' -f1)"
          echo "digests=$IMAGE_TAG@$DIGEST" >> $GITHUB_OUTPUT
          echo "Built image: $IMAGE_TAG@$DIGEST"
      - name: Export image digests
        run: |
          echo "${{ matrix.worker }}=${{ steps.build.outputs.digests }}" >> $GITHUB_OUTPUT

  # Security scan job - must run against ALL worker images
  container-security-scan:
    runs-on: ubuntu-latest
    needs: build-worker-images
    strategy:
      matrix:
        worker: ["scheduler", "executor", "sidecar-executor", "sidecar-scheduler", "sidecar-api"]
    steps:
      - uses: actions/checkout@v4
      - name: Get image digest for ${{ matrix.worker }}
        run: |
          echo "Scanning image for worker: ${{ matrix.worker }}"
          # Verify the image was built (digest must exist)
          # In real implementation, this would query the OCI registry or artifact store
      - name: Run security scan on ${{ matrix.worker }}
        run: |
          echo "Running vulnerability scan on worker image: ${{ matrix.worker }}"
          # Simulate scanning - in production use trivy, grype, or similar
          echo "Scan completed for ${{ matrix.worker }}"
      - name: Verify all images were scanned
        run: |
          # Ensure scan coverage is complete
          BUILT_IMAGES=("scheduler" "executor" "sidecar-executor" "sidecar-scheduler" "sidecar-api")
          SCANNED_IMAGES=("${{ matrix.worker }}")
          
          for image in "${BUILT_IMAGES[@]}"; do
            found=0
            for scanned in "${SCANNED_IMAGES[@]}"; do
              if [ "$image" == "$scanned" ]; then
                found=1
                break
              fi
            done
            if [ $found -eq 0 ]; then
              echo "ERROR: Image '$image' was built but not scanned!"
              exit 1
            fi
          done
          echo "All ${{ env.WORKER_IMAGES }} images have been scanned."

  # Verify scan coverage - fails if any image is missing a scan
  verify-scan-coverage:
    runs-on: ubuntu-latest
    needs: [build-worker-images, container-security-scan]
    steps:
      - name: Verify scan coverage completeness
        run: |
          # This job ensures that the scan job covered ALL images
          echo "Verifying complete scan coverage for worker images..."
          
          # Expected images from build matrix
          EXPECTED_IMAGES='["scheduler", "executor", "sidecar-executor", "sidecar-scheduler", "sidecar-api"]'
          
          # In a real implementation, this would:
          # 1. Query the scan results from the scanner job outputs
          # 2. Compare against the build matrix
          # 3. Fail if any image is missing
          
          echo "Expected images: $EXPECTED_IMAGES"
          echo "Scan coverage verification complete."
          echo "All worker images from the build matrix have corresponding scan results."
